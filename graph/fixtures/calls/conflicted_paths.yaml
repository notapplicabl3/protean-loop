# conflicted_paths — two members of one wave disagreeing about **one path**.
#
# `the build specification (not in this mirror)` § Deliverable 3, "A conflicted wave is a partial wave,
# not a containment fault" (folded: S-A32): the merged observation is marked `conflicted`, the
# conflicting paths are listed on it, the monitor grades **no predicate at all**, the unit stays
# `PENDING`, and `path_baselines` update from the **non-conflicting paths only** — one
# disagreement does not poison the paths nobody disputed. It is **not** `SeatUnavailable`:
# nothing was misconfigured, two members disagreed, which is a fact about the work.
#
# Both members observe `notes.md` and report different bytes for it; `checker` also observes a
# path nobody disputes, which is the one the baselines are allowed to take.

name: conflicted_paths

responses:
  # The opening call: the unit stack is empty and there is nothing to act on yet.
  - tier: manager
    when:
      escalation: empty_unit_stack
    result:
      emitter: manager
      units:
        - id: u-conflict-1
          goal_id: $goal
          intent: write the note and check it
          expected:
            - id: e-1
              kind: file_exists
              arguments:
                path: notes.md

  # The acting call: the manager restates the unit and dispatches its wave. The members are
  # listed in the order they are handed to the seam, which is the order `member#` is assigned
  # in — `writer` is member 1 and `checker` member 2, however they are later run.
  - tier: manager
    result:
      emitter: manager
      units:
        - id: u-conflict-1
          goal_id: $goal
          intent: write the note and check it
          expected:
            - id: e-1
              kind: file_exists
              arguments:
                path: notes.md
      wave:
        - kind: writer
          unit_id: u-conflict-1
          admitted_ref: admitted
        - kind: checker
          unit_id: u-conflict-1
          admitted_ref: admitted

  - tier: dispatch
    when:
      kind: writer
    result:
      emitter: dispatch
      unit_id: $unit
      narrative: wrote the note
      observations:
        - path: notes.md
          exists: true
          size_bytes: 42
          content_hash: sha-notes-a
      exit_code: 0
      expectation_values:
        e-1: wrote
      cited_ids:
        - c-1

  - tier: dispatch
    when:
      kind: checker
    result:
      emitter: dispatch
      unit_id: $unit
      narrative: read the same note and saw other bytes
      observations:
        - path: notes.md
          exists: true
          size_bytes: 99
          content_hash: sha-notes-DIFFERENT
        - path: agreed.md
          exists: true
          size_bytes: 7
          content_hash: sha-agreed-a
      exit_code: 3
      expectation_values:
        e-2: checked
      cited_ids:
        - c-1
        - c-2

  - tier: director
    result:
      emitter: director
      modulators:
        reward_error: 0.0
        arousal: 0.0
        confidence: 0.5
